<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维码生成 + 天气查询</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, sans-serif;
}
body {
background-color: #f5f7fa;
padding: 30px 20px;
}
.container {
background: #ffffff;
padding: 32px;
border-radius: 12px;
box-shadow: 0 4px 16px rgba(0,0,0,0.1);
width: 100%;
max-width: 480px;
margin: 0 auto 30px;
}
h1 {
text-align: center;
font-size: 22px;
margin-bottom: 24px;
color: #222;
}
h2 {
font-size:18px;
margin-bottom:16px;
color:#333;
border-bottom:1px solid #eee;
padding-bottom:8px;
}
textarea,input{
width: 100%;
padding: 12px;
border: 1px solid #ddd;
border-radius: 8px;
font-size: 15px;
margin-bottom:16px;
}
textarea{
height: 100px;
resize: none;
}
.btn-group{
display:flex;
gap:10px;
margin-bottom:24px;
}
button{
flex:1;
padding:12px;
border:none;
border-radius:8px;
font-size:15px;
cursor:pointer;
}
.btn-blue{
background:#2563eb;
color:white;
}
.btn-green{
background:#16a34a;
color:white;
}
.btn-orange{
background:#f97316;
color:white;
}
button:disabled{
background:#94a3b8;
cursor:not-allowed;
}
.qrcode-wrap{
text-align:center;
}
#qrcodeCanvas{
max-width:240px;
}
.weather-result{
padding:16px;
background:#f8fafc;
border-radius:8px;
min-height:100px;
line-height:1.8;
white-space: pre-line;
}
</style>
</head>
<body>
<!-- 二维码模块 -->
<div class="container">
<h2>二维码生成器</h2>
<textarea id="inputText" placeholder="请输入要生成二维码的内容..."></textarea>
<div class="btn-group">
<button id="genBtn" class="btn-blue">生成二维码</button>
<button id="downloadBtn" class="btn-green" disabled>下载保存</button>
</div>
<div class="qrcode-wrap">
<canvas id="qrcodeCanvas"></canvas>
</div>
</div>

<!-- 天气查询模块 -->
<div class="container">
<h2>天气查询</h2>
<input type="text" id="cityInput" placeholder="输入城市名称，例如：广州、北京">
<div class="btn-group">
<button id="weatherBtn" class="btn-orange">查询天气</button>
</div>
<div class="weather-result" id="weatherResult">
查询结果将显示在这里
</div>
</div>

<script>
// ============ 二维码部分 ============
const inputText = document.getElementById('inputText');
const genBtn = document.getElementById('genBtn');
const downloadBtn = document.getElementById('downloadBtn');
const canvas = document.getElementById('qrcodeCanvas');

genBtn.addEventListener('click', async ()=>{
const data = inputText.value.trim();
if(!data){
alert("请输入二维码内容！");
return;
}
try {
await QRCode.toCanvas(canvas, data, { width:240, margin:2 });
downloadBtn.disabled = false;
}catch(err){
console.error(err);
alert("二维码生成失败："+err.message);
}
})

downloadBtn.addEventListener('click', ()=>{
const link = document.createElement('a');
link.download = "qrcode.png";
link.href = canvas.toDataURL('image/png');
link.click();
})

// ============ 天气API部分【已替换为和风代理域名版本】 ============
const cityInput = document.getElementById('cityInput');
const weatherBtn = document.getElementById('weatherBtn');
const weatherResult = document.getElementById('weatherResult');

// 和风天气代理域名
const HOST = "me4ewvc2d7.re.qweatherapi.com";
// 在这里填入你的和风Web API KEY
const KEY = "粘贴你的和风KEY";

weatherBtn.addEventListener('click', async ()=>{
const city = cityInput.value.trim();
if(!city){
weatherResult.innerText = "请输入城市名称";
return;
}
weatherResult.innerText = "正在查询...";
try{
// 获取城市Location ID
const geoUrl = `https://${HOST}/geo/v2/city/lookup?location=${encodeURIComponent(city)}&key=${KEY}`;
const geoRes = await fetch(geoUrl);
const geoData = await geoRes.json();
if(geoData.code !== "200"){
weatherResult.innerText = `城市查询失败：${geoData.code}`;
return;
}
const locationId = geoData.location[0].id;
const cityName = geoData.location[0].name;

// 获取实时天气
const weatherUrl = `https://${HOST}/v7/weather/now?location=${locationId}&key=${KEY}`;
const weatherRes = await fetch(weatherUrl);
const weatherData = await weatherRes.json();
if(weatherData.code !== "200"){
weatherResult.innerText = `天气查询失败：${weatherData.code}`;
return;
}
const now = weatherData.now;
const outputText = `城市：${cityName}
天气：${now.text}
温度：${now.temp} ℃
体感温度：${now.feelsLike} ℃
风向：${now.windDir}
风力：${now.windScale} 级
湿度：${now.humidity} %`;
weatherResult.innerText = outputText;
}catch(err){
console.error(err);
weatherResult.innerText = "网络请求失败，请检查KEY或网络";
}
})
</script>
</body>
</html>

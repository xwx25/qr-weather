<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维码生成与天气查询</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft Yahei", system-ui, sans-serif;
}

body {
  background: linear-gradient(135deg, #eef2ff, #f0f9ff);
  padding: 40px 20px;
  min-height: 100vh;
}

.page-title {
  text-align: center;
  font-size: 26px;
  color: #1e293b;
  margin-bottom: 36px;
  font-weight: 600;
}

.container {
  background: #ffffff;
  padding: 32px;
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
  width: 100%;
  max-width: 520px;
  margin: 0 auto 30px;
  transition: 0.3s ease;
}

.container:hover {
  box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
}

h2 {
  font-size: 20px;
  margin-bottom: 20px;
  color: #334155;
  border-left: 4px solid #3b82f6;
  padding-left: 12px;
}

textarea,input{
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  font-size: 15px;
  margin-bottom:18px;
  outline: none;
  transition: 0.25s;
  background-color: #fbfefe;
}
textarea:focus,input:focus{
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

textarea{
  height: 110px;
  resize: none;
}

.btn-group{
  display:flex;
  gap:12px;
  margin-bottom:24px;
}

button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
  color:white;
  font-weight:500;
  transition: all 0.2s;
}
.btn-blue{
  background: #3b82f6;
}
.btn-blue:hover{
  background: #2563eb;
  transform: translateY(-2px);
}
.btn-green{
  background:#10b981;
}
.btn-green:hover{
  background:#059669;
  transform: translateY(-2px);
}
.btn-orange{
  background:#f97316;
}
.btn-orange:hover{
  background:#ea580c;
  transform: translateY(-2px);
}

button:disabled{
  background:#94a3b8;
  cursor:not-allowed;
  transform:none;
}

.qrcode-wrap{
  text-align:center;
  padding:16px;
  background-color: #f8fafc;
  border-radius:12px;
}
#qrcodeCanvas{
  max-width:240px;
}

.weather-result{
  padding:20px;
  background: linear-gradient(135deg,#f0f9ff,#f8fafc);
  border-radius:12px;
  min-height:130px;
  line-height:2;
  white-space: pre-line;
  color:#1e293b;
  font-size:15px;
}
</style>
</head>
<body>
<h1 class="page-title">二维码生成与天气查询系统</h1>

<!-- 二维码模块 -->
<div class="container">
<h2>二维码生成器</h2>
<textarea id="inputText" placeholder="请输入要生成二维码的内容，例如网址、文字信息..."></textarea>
<div class="btn-group">
<button id="genBtn" class="btn-blue">生成二维码</button>
<button id="downloadBtn" class="btn-green" disabled>下载二维码</button>
</div>
<div class="qrcode-wrap">
<canvas id="qrcodeCanvas"></canvas>
</div>
</div>

<!-- 天气查询模块 -->
<div class="container">
<h2>天气查询</h2>
<input type="text" id="cityInput" placeholder="输入城市名称，例如：广州">
<div class="btn-group">
<button id="weatherBtn" class="btn-orange">查询天气</button>
</div>
<div class="weather-result" id="weatherResult">
查询结果将在这里展示
</div>
</div>

<script>
// ============ 二维码功能 ============
const inputText = document.getElementById('inputText');
const genBtn = document.getElementById('genBtn');
const downloadBtn = document.getElementById('downloadBtn');
const canvas = document.getElementById('qrcodeCanvas');

genBtn.addEventListener('click', async ()=>{
const data = inputText.value.trim();
if(!data){
alert("请输入二维码内容！");
return;
}
try {
await QRCode.toCanvas(canvas, data, { width:240, margin:2 });
downloadBtn.disabled = false;
}catch(err){
console.error(err);
alert("二维码生成失败："+err.message);
}
})

downloadBtn.addEventListener('click', ()=>{
const link = document.createElement('a');
link.download = "qrcode.png";
link.href = canvas.toDataURL('image/png');
link.click();
})

// ============ 模拟天气 ============
const cityInput = document.getElementById('cityInput');
const weatherBtn = document.getElementById('weatherBtn');
const weatherResult = document.getElementById('weatherResult');

weatherBtn.addEventListener('click', async ()=>{
const city = cityInput.value.trim();
if(!city){
weatherResult.innerText = "请输入城市名称";
return;
}
weatherResult.innerText = "正在查询天气，请稍候...";

await new Promise(resolve => setTimeout(resolve, 600));

const temp = Math.floor(Math.random() * 15 + 20);
const tempLow = temp - 4;
const tempHigh = temp + 3;
const weatherList = ["晴","多云","阴天","小雨"];
const windList = ["东风","南风","西北风","东北风"];
const randomWeather = weatherList[Math.floor(Math.random()*weatherList.length)];
const randomWind = windList[Math.floor(Math.random()*windList.length)];

const outputText = `🏙️ 城市：${city}
🌤️ 天气：${randomWeather}
🌡️ 温度：${temp}℃
🌡️ 气温范围：${tempLow}℃ ~ ${tempHigh}℃
💨 风向：${randomWind} ${Math.floor(Math.random()*3)+1}级
🍃 空气质量：优
💡 提示：适合外出活动`;
weatherResult.innerText = outputText;
})
</script>
</body>
</html>
